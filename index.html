<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPTV Player</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#070a2e; color:#fff; font-family:sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:24px; padding:14px 30px; }
  .brand { font-size:28px; font-weight:bold; letter-spacing:1px; }
  #clock { font-size:26px; color:#ddd; flex:1; }
  .icon { background:none; border:0; color:#fff; font-size:30px; cursor:pointer; padding:6px 12px; border-radius:8px; }
  .icon:focus, .tile:focus, .btn:focus { outline:4px solid #fff; }
  #status { padding:0 30px; font-size:16px; color:#9aa; min-height:22px; }
  section { flex:1; min-height:0; display:flex; flex-direction:column; }
  section[hidden] { display:none; }

  /* Startseite */
  #home { padding:20px 30px; }
  .tiles { display:grid; grid-template-columns:1.1fr 1fr 1fr; gap:24px; }
  .tile { height:300px; border-radius:16px; display:flex; flex-direction:column; justify-content:flex-end; padding:22px; font-size:34px; font-weight:bold; cursor:pointer; }
  .tile small { font-size:18px; font-weight:normal; opacity:.9; margin-top:6px; }
  .live   { background:linear-gradient(#36d99a,#3b3bf0); }
  .movie  { background:linear-gradient(120deg,#e0234f,#f7b03a); }
  .series { background:linear-gradient(120deg,#a02fc0,#4aa0e6); }
  .buttons { display:grid; grid-template-columns:1fr 1fr 1fr; gap:24px; margin-top:24px; }
  .btn { background:#6aaa86; color:#fff; border:0; border-radius:10px; padding:20px; font-size:22px; font-weight:bold; cursor:pointer; }
  .footer { display:flex; justify-content:space-between; font-size:24px; margin-top:40px; }

  /* Login */
  #login { padding:40px 30px; max-width:700px; gap:14px; }
  #login label { font-size:18px; color:#ccc; }
  #login input { padding:12px; font-size:20px; background:#1a1f4a; color:#fff; border:1px solid #334; border-radius:6px; }
  #login .btn { margin-top:10px; }

  /* Listenansicht */
  .back { padding:0 30px 10px; }
  main { flex:1; display:flex; min-height:0; }
  .col { overflow-y:auto; padding:6px; }
  #groups { width:17%; background:#0b0f3a; }
  #channels { width:30%; }
  .item { padding:10px 12px; font-size:19px; border-radius:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .item.focus { outline:2px solid #6aa8ff; }
  .item.active { background:#3b5bdb; }
  #video { flex:1; background:#000; min-width:0; }

  /* Handy: Spalten untereinander, Player oben */
  @media (max-width: 700px) {
    body { height:auto; min-height:100vh; overflow:auto; }
    header { flex-wrap:wrap; padding:10px 14px; gap:12px; }
    .tiles { grid-template-columns:1fr; }
    .tile { height:150px; font-size:28px; }
    .buttons { grid-template-columns:1fr; }
    .footer { flex-direction:column; gap:6px; font-size:18px; }
    main { flex-direction:column; }
    #video { width:100%; height:35vh; flex:none; }
    #groups, #channels { width:100%; max-height:28vh; }
    .item { font-size:17px; padding:12px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">IPTV Player</div>
  <div id="clock"></div>
  <button class="icon" id="refresh" title="Aktualisieren">⟳</button>
  <button class="icon" id="settings" title="Einstellungen">⚙</button>
</header>
<div id="status"></div>

<!-- Startseite: Kacheln und Schaltflächen wie in der Vorlage -->
<section id="home">
  <div class="tiles">
    <div class="tile live" tabindex="0" data-k="live">LIVE<small>Sender</small></div>
    <div class="tile movie" tabindex="0" data-k="movie">MOVIES<small>Filme</small></div>
    <div class="tile series" tabindex="0" data-k="series">SERIES<small>Serien</small></div>
  </div>
  <div class="buttons">
    <button class="btn" tabindex="0" id="acc">KONTO</button>
    <button class="btn" tabindex="0" id="setbtn">EINSTELLUNGEN</button>
    <button class="btn" tabindex="0" id="refresh2">AKTUALISIEREN</button>
  </div>
  <div class="footer"><span id="exp"></span><span id="prof"></span></div>
</section>

<!-- Zugangsdaten (Xtream-Codes) -->
<section id="login" hidden>
  <label for="srv">Server (mit http:// und Port)</label>
  <input id="srv" placeholder="http://server:8080">
  <label for="usr">Benutzername</label>
  <input id="usr">
  <label for="pw">Passwort</label>
  <input id="pw" type="password">
  <label for="prx">Proxy-Adresse (vom Cloudflare Worker)</label>
  <input id="prx" placeholder="https://iptv-proxy.DEIN-NAME.workers.dev">
  <button class="btn" id="save">Anmelden und speichern</button>
</section>

<!-- Listenansicht mit Player -->
<section id="section" hidden>
  <div class="back"><button class="btn" id="back" style="padding:10px 16px;font-size:18px">← Start</button></div>
  <main>
    <div id="groups" class="col"></div>
    <div id="channels" class="col"></div>
    <video id="video" controls></video>
  </main>
</section>

<!-- hls.js lokal im selben Ordner ablegen -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1/dist/mpegts.js"></script>
<script>
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;

const CAT = {
  live:   ['get_live_categories',   'get_live_streams'],
  movie:  ['get_vod_categories',    'get_vod_streams'],
  series: ['get_series_categories', 'get_series'],
};

let cfg = JSON.parse(localStorage.getItem('xt') || 'null');  // { server, user, pass }
let info = null;          // user_info aus der API
let kind = null;          // 'live' | 'movie' | 'series'
let cats = [], items = [];
let catIdx = 0, itemIdx = 0, column = 'channels';
let cache = {};
let hls = null;
let tsPlayer = null;

const base = () => cfg.server.replace(/\/$/, '');
// Alle Anfragen gehen über den Proxy, damit der Browser keine http-Verbindung blockiert
const px = url => cfg.proxy ? `${cfg.proxy.replace(/\/$/, '')}/?u=${enc(url)}` : url;
const fmtDate = ts => ts ? new Date(Number(ts) * 1000).toLocaleDateString('de-DE') : '–';
const setStatus = t => { $('status').textContent = t; };

function api(action, extra = '') {
  const url = `${base()}/player_api.php?username=${enc(cfg.user)}&password=${enc(cfg.pass)}` +
              (action ? `&action=${action}` : '') + extra;
  return fetch(px(url)).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}

function show(id) {
  ['home', 'login', 'section'].forEach(s => $(s).hidden = s !== id);
}

function showHome() {
  show('home');
  if (info) {
    $('exp').textContent = 'Ablauf: ' + fmtDate(info.exp_date);
    $('prof').textContent = 'Profil: ' + cfg.user;
  }
  document.querySelector('#home [tabindex]').focus();
}

function showLogin() {
  show('login');
  $('srv').value = cfg?.server || '';
  $('usr').value = cfg?.user || '';
  $('pw').value = cfg?.pass || '';
  $('prx').value = cfg?.proxy || '';
  $('srv').focus();
}

async function login() {
  const c = { server: $('srv').value.trim(), user: $('usr').value.trim(), pass: $('pw').value, proxy: $('prx').value.trim() };
  if (!c.server || !c.user || !c.pass) return setStatus('Bitte alle Felder ausfüllen.');
  cfg = c;
  try {
    const d = await api('');
    if (!d.user_info || d.user_info.auth !== 1) throw new Error('Anmeldung abgelehnt');
    info = d.user_info;
    localStorage.setItem('xt', JSON.stringify(cfg));
    cache = {};
    setStatus('Angemeldet.');
    showHome();
  } catch (e) {
    setStatus('Fehler: ' + e.message + ' (ggf. CORS oder Server nicht erreichbar)');
  }
}

async function openSection(k) {
  if (!cfg) return showLogin();
  kind = k;
  show('section');
  cats = []; items = [];
  setStatus('Lade Kategorien ...');
  try {
    const key = 'cat|' + k;
    if (!cache[key]) cache[key] = await api(CAT[k][0]);
    cats = [{ id: '', name: 'Alle' }, ...cache[key].map(c => ({ id: c.category_id, name: c.category_name }))];
    catIdx = 0; column = 'channels';
    await loadItems();
  } catch (e) {
    setStatus('Fehler: ' + e.message);
  }
}

async function loadItems() {
  const cid = cats[catIdx].id;
  const key = kind + '|' + cid;
  if (!cache[key]) {
    setStatus('Lade Einträge ...');
    cache[key] = await api(CAT[kind][1], cid ? '&category_id=' + enc(cid) : '');
  }
  items = cache[key].map(toItem);
  itemIdx = 0;
  setStatus(items.length + ' Einträge');
  renderLists();
}

function toItem(x) {
  if (kind === 'live')  return { name: x.name, ts: true, url: px(`${base()}/live/${enc(cfg.user)}/${enc(cfg.pass)}/${x.stream_id}.ts`) };
  if (kind === 'movie') return { name: x.name, url: px(`${base()}/movie/${enc(cfg.user)}/${enc(cfg.pass)}/${x.stream_id}.${x.container_extension || 'mp4'}`) };
  return { name: x.name, seriesId: x.series_id };
}

async function openSeries(it) {
  setStatus('Lade Folgen ...');
  try {
    const d = await api('get_series_info', '&series_id=' + enc(it.seriesId));
    const eps = [];
    for (const season of Object.keys(d.episodes || {})) {
      for (const ep of d.episodes[season]) {
        eps.push({
          name: `S${season} E${ep.episode_num} ${ep.title || ''}`.trim(),
          url: px(`${base()}/series/${enc(cfg.user)}/${enc(cfg.pass)}/${ep.id}.${ep.container_extension || 'mp4'}`),
        });
      }
    }
    items = eps; itemIdx = 0; column = 'channels';
    setStatus(eps.length + ' Folgen');
    renderLists();
  } catch (e) {
    setStatus('Fehler: ' + e.message);
  }
}

function play(it) {
  const v = $('video');
  if (hls) { hls.destroy(); hls = null; }
  if (tsPlayer) { tsPlayer.destroy(); tsPlayer = null; }
  if (it.ts && window.mpegts && mpegts.isSupported()) {
    // Live-Sender als .ts-Stream
    tsPlayer = mpegts.createPlayer({ type: 'mpegts', isLive: true, url: it.url });
    tsPlayer.attachMediaElement(v);
    tsPlayer.on(mpegts.Events.ERROR, (t, d) => setStatus('Stream-Fehler: ' + it.name + ' (' + t + ')'));
    tsPlayer.load();
    tsPlayer.play();
  } else if (it.url.includes('.m3u8') && window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(it.url);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
    hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) setStatus('Stream-Fehler: ' + it.name + ' (' + d.details + ')'); });
  } else {
    v.src = it.url;
    v.play().catch(() => {});
  }
  setStatus('Spiele: ' + it.name);
  renderLists();
}

function renderLists() {
  const g = $('groups'), c = $('channels');
  g.innerHTML = ''; c.innerHTML = '';
  cats.forEach((cat, i) => {
    const d = document.createElement('div');
    d.className = 'item' + (i === catIdx ? ' active' : '');
    d.textContent = cat.name;
    d.onclick = () => { catIdx = i; column = 'groups'; loadItems(); };
    g.appendChild(d);
  });
  items.forEach((it, i) => {
    const d = document.createElement('div');
    d.className = 'item';
    d.textContent = it.name;
    d.onclick = () => { itemIdx = i; column = 'channels'; activate(); };
    c.appendChild(d);
  });
  setFocus();
}

function setFocus() {
  [...$('groups').children].forEach((el, i) => el.classList.toggle('focus', column === 'groups' && i === catIdx));
  [...$('channels').children].forEach((el, i) => el.classList.toggle('focus', column === 'channels' && i === itemIdx));
  const f = column === 'groups' ? $('groups').children[catIdx] : $('channels').children[itemIdx];
  f?.scrollIntoView({ block: 'nearest' });
}

function activate() {
  const it = items[itemIdx];
  if (!it) return;
  if (it.seriesId) openSeries(it); else play(it);
}

// Fernbedienung auf der Startseite: Pfeile wechseln den Fokus, OK aktiviert
function homeKeys(e) {
  const els = [...document.querySelectorAll('#home [tabindex]')];
  const idx = els.indexOf(document.activeElement);
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { els[Math.min(idx + 1, els.length - 1)]?.focus(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { els[Math.max(idx - 1, 0)]?.focus(); e.preventDefault(); }
  else if (e.key === 'Enter' && idx >= 0) { e.preventDefault(); els[idx].click(); }
}

// Fernbedienung in der Listenansicht
function listKeys(e) {
  const len = column === 'groups' ? cats.length : items.length;
  switch (e.key) {
    case 'ArrowDown':  if (column === 'groups') catIdx = Math.min(catIdx + 1, len - 1); else itemIdx = Math.min(itemIdx + 1, len - 1); setFocus(); break;
    case 'ArrowUp':    if (column === 'groups') catIdx = Math.max(catIdx - 1, 0); else itemIdx = Math.max(itemIdx - 1, 0); setFocus(); break;
    case 'ArrowLeft':  if (column === 'channels') { column = 'groups'; setFocus(); } break;
    case 'ArrowRight': if (column === 'groups') { column = 'channels'; setFocus(); } break;
    case 'Enter':
      if (column === 'groups') { column = 'channels'; loadItems(); } else activate();
      break;
    case 'Backspace': case 'Escape': showHome(); break;
  }
}

document.addEventListener('keydown', e => {
  if (document.activeElement.tagName === 'INPUT') return;
  if (!$('section').hidden) listKeys(e);
  else if (!$('home').hidden) homeKeys(e);
});

document.querySelectorAll('.tile').forEach(t => t.onclick = () => openSection(t.dataset.k));
$('acc').onclick = () => {
  if (!info) return setStatus('Nicht angemeldet.');
  setStatus(`Status: ${info.status}, Verbindungen: ${info.active_cons}/${info.max_connections}, Ablauf: ${fmtDate(info.exp_date)}`);
};
$('setbtn').onclick = $('settings').onclick = showLogin;
$('refresh').onclick = $('refresh2').onclick = () => {
  cache = {};
  setStatus('Zwischenspeicher geleert.');
  if (!$('section').hidden) loadItems();
};
$('back').onclick = showHome;
$('save').onclick = login;

function tick() {
  $('clock').textContent = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
}
setInterval(tick, 30000);
tick();

// Start: gespeicherte Zugangsdaten prüfen
if (cfg) {
  api('').then(d => { info = d.user_info; showHome(); })
         .catch(e => { setStatus('Verbindung fehlgeschlagen: ' + e.message); showLogin(); });
} else {
  showLogin();
}
</script>
</body>
</html>
