<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>IPFLIX</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<!--HOME_PROXY-->
<style>
  :root {
    --bg: #141414; --surface: #181818; --card: #2a2a2a; --line: #404040;
    --text: #fff; --muted: #b3b3b3; --accent: #e32636; --link: #54b9c5;
    --pad: 4%; --gap: 8px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  /* Navigation */
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; gap: 28px;
        padding: 16px var(--pad); background: linear-gradient(rgba(0,0,0,.75), transparent); transition: background .3s; }
  nav.solid { background: var(--bg); }
  .brand { color: var(--accent); font-weight: 900; font-size: 28px; letter-spacing: 2px; text-transform: uppercase;
           background: none; border: 0; cursor: pointer; padding: 0; white-space: nowrap; text-align: left; }
  .links { display: flex; gap: 20px; flex: 1; min-width: 0; }
  .links button { background: none; border: 0; color: #e5e5e5; font-size: 15px; cursor: pointer; padding: 4px 0; white-space: nowrap; }
  .links button:hover { color: var(--muted); }
  .links button.on { color: #fff; font-weight: 700; }
  .tools { display: flex; align-items: center; gap: 14px; }
  .searchbox { display: flex; align-items: center; border: 1px solid transparent; padding: 3px 6px; transition: background .3s; }
  .searchbox.open { border-color: #fff; background: rgba(0,0,0,.75); }
  .searchbox input { width: 0; padding: 0; border: 0; background: transparent; outline: none; font-size: 15px; transition: width .3s; }
  .searchbox.open input { width: 210px; padding: 3px 6px; }
  .iconbtn { background: none; border: 0; cursor: pointer; font-size: 20px; padding: 4px 6px; line-height: 1; display: inline-flex; align-items: center; }
  .avatar { width: 34px; height: 34px; border-radius: 4px; border: 0; cursor: pointer;
            background: linear-gradient(135deg, #2b6cb0, #38b2ac); font-weight: 700; }
  #menu { position: fixed; right: var(--pad); top: 64px; z-index: 30; background: rgba(0,0,0,.92); border: 1px solid #333;
          min-width: 230px; padding: 6px 0; }
  #menu .info { padding: 10px 16px; color: var(--muted); font-size: 13px; line-height: 1.6; border-bottom: 1px solid #333; white-space: pre-line; }
  #menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 11px 16px; cursor: pointer; font-size: 14px; }
  #menu button:hover { text-decoration: underline; }
  #menu button:focus-visible { text-decoration: underline; outline: none; }
  body.auth .links, body.auth .tools { display: none; }

  /* Titelbild */
  .hero { position: relative; height: 56.25vw; max-height: 82vh; min-height: 420px; display: flex; align-items: flex-end; padding: 0 var(--pad) 14vh; }
  .hero-bg { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: #000 center 20% / cover no-repeat; }
  .hero::after { content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none;
                 background: linear-gradient(to top, var(--bg), rgba(20,20,20,0) 38%), linear-gradient(77deg, rgba(0,0,0,.8), rgba(0,0,0,.1) 70%); }
  .hero-content { position: relative; z-index: 1; max-width: 600px; }
  .hero h1, .modal h1 { font-size: 52px; font-size: clamp(30px, 4.6vw, 64px); line-height: 1.05; margin: 0 0 14px; text-shadow: 2px 2px 6px rgba(0,0,0,.5); }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; color: #ddd; font-size: 15px; margin-bottom: 10px; }
  .meta .rate { color: #46d369; font-weight: 700; }
  .meta .tag { border: 1px solid rgba(255,255,255,.4); padding: 0 6px; font-size: 13px; }
  .plot { font-size: 17px; font-size: clamp(14px, 1.3vw, 18px); line-height: 1.45; margin: 0; text-shadow: 1px 1px 3px rgba(0,0,0,.6);
          display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 4px;
         padding: 10px 26px; font-size: 17px; font-weight: 700; cursor: pointer; }
  .btn.play { background: #fff; color: #000; }
  .btn.play:hover { background: rgba(255,255,255,.75); }
  .btn.more { background: rgba(109,109,110,.7); color: #fff; }
  .btn.more:hover { background: rgba(109,109,110,.4); }
  .btn.red { background: var(--accent); color: #fff; width: 100%; padding: 14px; }
  .btn.round { width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,.6);
               background: rgba(42,42,42,.6); color: #fff; font-size: 20px; }
  .btn.round:hover { border-color: #fff; }

  /* Reihen */
  #rows { position: relative; z-index: 2; margin-top: -9vh; padding-bottom: 60px; }
  #main.plain #rows { margin-top: 0; padding-top: 96px; }
  .page-title { font-size: 34px; font-size: clamp(24px, 2.6vw, 40px); margin: 0 var(--pad) 20px; }
  .row { margin-bottom: 2.6vw; }
  .row h2, .section-title { display: flex; gap: 14px; align-items: baseline; margin: 0 var(--pad) 4px;
            font-size: 20px; font-size: clamp(16px, 1.4vw, 22px); font-weight: 700; color: #e5e5e5; }
  .row h2 button { background: none; border: 0; padding: 0; color: var(--link); font-size: 13px; font-weight: 700; cursor: pointer; }
  .slider { display: flex; gap: var(--gap); overflow-x: auto; padding: 12px var(--pad) 22px; scroll-padding: 0 var(--pad);
            scroll-snap-type: x proximity; scrollbar-width: none; }
  .slider::-webkit-scrollbar { display: none; }
  /* Pfeile zum Blättern mit Maus oder TV-Zeiger */
  .slidewrap { position: relative; }
  .chev { position: absolute; top: 12px; bottom: 22px; z-index: 4; width: var(--pad); min-width: 40px; border: 0; cursor: pointer;
          background: rgba(20,20,20,.55); color: #fff; font-size: 44px; line-height: 1; opacity: .55; transition: opacity .2s; }
  .chev.l { left: 0; } .chev.r { right: 0; }
  .chev:hover { opacity: 1; background: rgba(20,20,20,.8); }
  @media (hover: none) and (pointer: coarse) { .chev { display: none; } }
  .card { flex: 0 0 auto; position: relative; border-radius: 4px; overflow: hidden; background: var(--card); cursor: pointer;
          scroll-snap-align: start; transition: transform .25s ease, box-shadow .25s ease; }
  .card.poster { width: 13.5vw; width: clamp(112px, 13.5vw, 210px); aspect-ratio: 2 / 3; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .label { position: absolute; left: 0; right: 0; bottom: 0; padding: 24px 9px 8px; font-size: 13px; font-weight: 700;
                 background: linear-gradient(transparent, rgba(0,0,0,.9)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .fallback { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center; text-align: center;
                    padding: 12px; font-weight: 700; font-size: 15px; background: linear-gradient(160deg, #3a3a3a, #1a1a1a); }
  .card .bar { position: absolute; left: 9px; right: 9px; bottom: 4px; height: 3px; background: rgba(255,255,255,.3); }
  .card .bar i { display: block; height: 100%; background: var(--accent); }
  .card.has-bar .label { padding-bottom: 12px; }
  .more-card { display: flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 700; background: #1f1f1f; }
  @media (hover: hover) { .card:hover { transform: scale(1.08); z-index: 3; box-shadow: 0 10px 24px rgba(0,0,0,.75); } }
  .card:focus-visible { transform: scale(1.08); z-index: 3; outline: 3px solid #fff; outline-offset: 0; }

  /* Sender: Logo ohne Kasten, Name darunter */
  .card.chan { width: 12.5vw; width: clamp(116px, 12.5vw, 196px); background: none; overflow: visible; border-radius: 12px;
               padding: 12px 10px 10px; text-align: center; transition: background .2s ease; }
  .chan .logo { position: relative; padding-top: 54%; }
  .chan .logo img, .chan .ctext { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .chan .logo img { object-fit: contain; -webkit-filter: drop-shadow(0 4px 10px rgba(0,0,0,.6)); filter: drop-shadow(0 4px 10px rgba(0,0,0,.6));
                    transition: transform .25s ease; }
  .chan .ctext { display: flex; align-items: center; justify-content: center; overflow: hidden; font-weight: 800; font-size: 17px;
                 line-height: 1.15; letter-spacing: .4px; color: #f2f2f2; transition: transform .25s ease; }
  .chan .cname { margin-top: 10px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                 transition: color .2s ease; }
  .chan.nologo .cname { visibility: hidden; }
  @media (hover: hover) {
    .card.chan:hover { transform: none; box-shadow: none; background: rgba(255,255,255,.07); }
    .chan:hover .logo img, .chan:hover .ctext { transform: scale(1.12); }
    .chan:hover .cname { color: #fff; }
  }
  .card.chan:focus-visible { transform: none; outline: 2px solid rgba(255,255,255,.9); background: rgba(255,255,255,.1); }
  .chan:focus-visible .logo img, .chan:focus-visible .ctext { transform: scale(1.12); }
  .chan:focus-visible .cname { color: #fff; }
  .more-card.chan { display: flex; align-items: center; justify-content: center; color: var(--link); font-size: 14px; }
  .chan .cnote { margin-top: 3px; font-size: 12px; font-weight: 700; line-height: 1.25; color: var(--accent); }

  /* Nächstes Spiel des Lieblingsvereins */
  .match { margin: 0 var(--pad) 2.6vw; padding: 20px 0 6px; border-radius: 12px; border: 1px solid rgba(255,255,255,.1);
           background: linear-gradient(100deg, rgba(227,38,54,.22), rgba(255,255,255,.04) 55%, rgba(253,185,19,.10)); }
  .mhead { display: flex; align-items: center; flex-wrap: wrap; padding: 0 24px; }
  .mbadge { width: 64px; height: 64px; object-fit: contain; flex: none; margin-right: 18px; }
  .mtxt { margin-right: 18px; min-width: 0; }
  .mleague { font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .match h2 { margin: 2px 0 4px; font-size: 26px; font-size: clamp(20px, 2.2vw, 30px); line-height: 1.15; }
  .mmeta { color: #ddd; font-size: 15px; }
  .mpill { margin-left: auto; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.14); font-weight: 700; font-size: 14px; white-space: nowrap; }
  .mpill.live { background: var(--accent); }
  .mlater { padding: 12px 24px 0; color: var(--muted); font-size: 13px; }
  .match h3 { margin: 16px 24px 0; font-size: 15px; color: #e5e5e5; }
  .match .slider { padding: 6px 16px 10px; scroll-padding: 0 16px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
          grid-template-columns: repeat(auto-fill, minmax(clamp(112px, 13.5vw, 210px), 1fr));
          gap: 18px var(--gap); padding: 12px var(--pad) 30px; }
  .grid.chan { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
               grid-template-columns: repeat(auto-fill, minmax(clamp(116px, 12.5vw, 196px), 1fr)); }
  .grid .card { width: auto; }
  .empty { color: var(--muted); margin: 30px var(--pad); font-size: 16px; }
  .spinner { width: 52px; height: 52px; margin: 40vh auto; border: 4px solid #333; border-top-color: var(--accent);
             border-radius: 50%; animation: spin 1s linear infinite; }
  .spinner.small { width: 32px; height: 32px; margin: 30px auto; border-width: 3px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Details */
  .modal-wrap { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 40; background: rgba(0,0,0,.7); overflow-y: auto; display: flex;
                justify-content: center; padding: 32px 12px; }
  .modal { position: relative; width: 100%; max-width: 860px; height: max-content; background: var(--surface); border-radius: 8px;
           overflow: hidden; box-shadow: 0 12px 48px #000; }
  .modal .top { position: relative; aspect-ratio: 16 / 9; max-height: 60vh; background: #000 center 20% / cover no-repeat; display: flex; align-items: flex-end; }
  .modal .top::after { content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(to top, var(--surface), transparent 55%); }
  .modal .top .hero-content { padding: 0 44px 34px; }
  .modal h1 { font-size: 40px; font-size: clamp(26px, 3.6vw, 44px); }
  .modal .close { position: absolute; top: 14px; right: 14px; z-index: 2; width: 38px; height: 38px; background: var(--surface); border: 0; font-size: 18px; }
  .modal .body { display: grid; grid-template-columns: 2fr 1fr; gap: 28px; padding: 6px 44px 30px; }
  .modal .body p { line-height: 1.5; margin: 0; }
  .side { color: var(--muted); font-size: 14px; line-height: 1.6; }
  .side div { margin-bottom: 8px; }
  .side b { color: #777; font-weight: 400; }
  .episodes { padding: 0 44px 36px; }
  .ephead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .ephead h3 { font-size: 24px; margin: 0; }
  select { background: #242424; border: 1px solid #4d4d4d; border-radius: 4px; padding: 9px 12px; font-size: 16px; }
  .ep { display: flex; gap: 16px; align-items: center; padding: 16px; border-bottom: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
  .ep:hover { background: #333; }
  .ep:focus-visible { background: #333; }
  .ep .n { font-size: 24px; color: #d2d2d2; width: 32px; text-align: center; flex: none; }
  .ep .thumb { position: relative; width: 140px; aspect-ratio: 16 / 9; flex: none; border-radius: 4px; overflow: hidden; background: #333; }
  .ep .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ep .thumb .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.3); }
  .ep .thumb .bar i { display: block; height: 100%; background: var(--accent); }
  .ep .t { flex: 1; min-width: 0; }
  .ep .t b { display: flex; justify-content: space-between; gap: 10px; font-size: 16px; }
  .ep .t b span:last-child { font-weight: 400; color: var(--muted); white-space: nowrap; }
  .ep .t p { color: var(--muted); font-size: 14px; margin: 6px 0 0; line-height: 1.4;
             display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  /* Player */
  #player { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 60; background: #000; }
  #player video { width: 100%; height: 100%; display: block; background: #000; }
  .pbar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 16px; padding: 16px 22px;
          padding-top: max(16px, env(safe-area-inset-top)); background: linear-gradient(rgba(0,0,0,.85), transparent); transition: opacity .4s; }
  #player.idle .pbar { opacity: 0; pointer-events: none; }
  #player.idle { cursor: none; }
  .pbar .iconbtn { font-size: 28px; }
  .pbar .ttl { flex: 1; min-width: 0; }
  .pbar .ttl b { display: block; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pbar .ttl small { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Hinweise */
  #toast { position: fixed; left: 50%; bottom: 24px; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 80;
           width: max-content; max-width: 92vw; max-width: min(680px, 92vw); background: #232323; border-left: 4px solid var(--accent);
           padding: 12px 44px 12px 16px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word;
           box-shadow: 0 8px 28px #000; border-radius: 4px; }
  #toast button { position: absolute; top: 6px; right: 6px; }
  #toastActs { display: flex; flex-wrap: wrap; gap: 8px; }
  #toast a { margin-top: 10px; padding: 8px 16px; font-size: 15px; text-decoration: none; white-space: normal; }

  /* Anmeldung */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 96px 16px 40px;
           background: radial-gradient(ellipse at top, #3b0d12, var(--bg) 65%); }
  .login-card { width: 100%; max-width: 450px; background: rgba(0,0,0,.75); padding: 48px 56px; border-radius: 6px; display: flex; flex-direction: column; gap: 14px; }
  .login-card h1 { margin: 0 0 8px; font-size: 32px; }
  .login-card label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
  .login-card input { padding: 15px 16px; font-size: 16px; background: #333; border: 0; border-radius: 4px; }
  .login-card input:focus { background: #454545; outline: none; }
  .login-card .hint { color: #8c8c8c; font-size: 13px; line-height: 1.5; margin: 6px 0 0; }
  #loginErr { color: #e87c03; font-size: 14px; min-height: 1em; margin: 0; }

  @media (max-width: 760px) {
    nav { flex-wrap: wrap; gap: 8px 18px; padding: 10px 16px; }
    .brand { font-size: 20px; flex: 1; }
    .links { order: 3; flex-basis: 100%; overflow-x: auto; gap: 18px; scrollbar-width: none; }
    .links::-webkit-scrollbar { display: none; }
    .searchbox.open input { width: 120px; }
    #menu { top: 96px; right: 16px; }
    .hero { min-height: 72vh; padding-bottom: 9vh; }
    .hero .plot { -webkit-line-clamp: 2; }
    .btn { padding: 9px 18px; font-size: 15px; }
    #rows { margin-top: -5vh; }
    #main.plain #rows { padding-top: 110px; }
    .slider { padding: 8px 16px 16px; scroll-padding: 0 16px; }
    .row h2, .section-title, .page-title { margin-left: 16px; margin-right: 16px; }
    .grid { padding: 8px 16px 24px; gap: 12px 8px; }
    .modal-wrap { padding: 0; }
    .modal { border-radius: 0; min-height: 100%; }
    .modal .top .hero-content { padding: 0 16px 18px; }
    .modal .body { grid-template-columns: 1fr; gap: 14px; padding: 4px 16px 20px; }
    .episodes { padding: 0 8px 30px; }
    .ep { padding: 12px 8px; gap: 10px; }
    .ep .n { display: none; }
    .ep .thumb { width: 110px; }
    .login-card { padding: 32px 22px; }
    .match { margin-left: 16px; margin-right: 16px; }
    .mhead { padding: 0 14px; }
    .mbadge { width: 44px; height: 44px; margin-right: 10px; }
    .mpill { margin: 10px 0 0; }
    .mlater, .match h3 { padding-left: 0; margin-left: 14px; margin-right: 14px; }
    .match .slider { padding: 6px 6px 10px; }
  }

  /* ---- Ältere Browser (z. B. Fernseher mit Chrome 77): Ersatz für neuere CSS-Funktionen ---- */
  @supports not (aspect-ratio: 1 / 1) {
    .card.poster::before { content: ''; display: block; padding-top: 150%; }
    .card.poster img { position: absolute; top: 0; left: 0; }
    .modal .top::before { content: ''; padding-top: 56.25%; }
    .ep .thumb { height: 79px; }
    @media (max-width: 760px) { .ep .thumb { height: 62px; } }
  }
  /* kein :focus-visible: Auswahl mit der Fernbedienung trotzdem sichtbar machen */
  .no-fv :focus { outline: 3px solid #fff; outline-offset: 2px; }
  .no-fv .card:focus { transform: scale(1.08); z-index: 3; outline-offset: 0; }
  .no-fv .card.chan:focus { transform: none; outline: 2px solid rgba(255,255,255,.9); background: rgba(255,255,255,.1); }
  .no-fv .chan:focus .logo img, .no-fv .chan:focus .ctext { transform: scale(1.12); }
  .no-fv .chan:focus .cname { color: #fff; }
  .no-fv .ep:focus { background: #333; }
  .no-fv #menu button:focus { text-decoration: underline; outline: none; }
  /* kein "gap" in Flexbox: Abstände über Ränder */
  .no-gap nav > * + * { margin-left: 28px; }
  .no-gap .links > * + * { margin-left: 20px; }
  .no-gap .tools > * + * { margin-left: 14px; }
  .no-gap .meta > * { margin-right: 12px; }
  .no-gap .actions > * { margin-right: 10px; }
  .no-gap .row h2 button { margin-left: 14px; }
  .no-gap .slider > * + * { margin-left: var(--gap); }
  .no-gap .ep > * + * { margin-left: 16px; }
  .no-gap .ep .t b span + span { margin-left: 10px; }
  .no-gap .pbar > * + * { margin-left: 16px; }
  .no-gap .login-card > * + * { margin-top: 14px; }
  .no-gap .login-card label > * + * { margin-top: 6px; }
  .no-gap #toastActs > * { margin-right: 8px; }
</style>
</head>
<body class="auth">

<nav id="nav">
  <button class="brand" id="brand" data-view="home">IPFLIX</button>
  <div class="links">
    <button data-view="home">Startseite</button>
    <button data-view="live">Live TV</button>
    <button data-view="movie">Filme</button>
    <button data-view="series">Serien</button>
    <button data-view="mylist">Meine Liste</button>
  </div>
  <div class="tools">
    <div class="searchbox">
      <button class="iconbtn" id="searchBtn" aria-label="Suchen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
      <input id="q" type="search" placeholder="Titel, Sender" autocomplete="off" aria-label="Suche">
    </div>
    <button class="avatar" id="avatar" aria-label="Konto und Einstellungen"></button>

/* ---------- Zugangsdaten ---------- */

/* ---------- Daten ---------- */
const CAT = {
  live:   ['get_live_categories',   'get_live_streams'],
  movie:  ['get_vod_categories',    'get_vod_streams'],
  series: ['get_series_categories', 'get_series'],

const memo = {};
const once = (key, fn) => memo[key] || (memo[key] = fn().catch(e => { delete memo[key]; throw e; }));
const arr = a => Array.isArray(a) ? a : [];

// Anbieter-Namen aufräumen: "(DE-) The Mummy - 2026" -> "The Mummy" (Jahr 2026), "DE: RTL HD" -> "RTL HD"
const LANG_PREFIX = /^\s*(?:[\[(|]+\s*[A-Za-z]{2,4}\s*[-:]?\s*[\])|]+|(?:DE|GER|TR|TUR|AT|EN|FR)\s*[-:|★•]+)\s*/;
const YEAR_SUFFIX = /\s*(?:[-–|]\s*|\()((?:19|20)\d{2})\)?\s*$/;
function pretty(name) {
  const raw = String(name || '');
  let title = raw.replace(LANG_PREFIX, '').trim(), yr = '';
  const m = title.match(YEAR_SUFFIX);
  if (m && m.index > 0) { yr = m[1]; title = title.slice(0, m.index).trim(); }
  return { title: title || raw, year: yr };
}
const chanName = name => String(name || '').replace(LANG_PREFIX, '').replace(/^(?:DE|GER|TR|TUR|AT)\s+(?=\S)/, '').trim() || String(name || '');
// Trenn-Einträge des Anbieters wie "-- TURKIYE --" oder "##### DE #####" sind keine Sender
const SEP = '[-–—=#*_~•●★▬■◆►◄|.:+<>]';
const PLACEHOLDER = new RegExp(`^\\s*${SEP}{2,}.*${SEP}{2,}\\s*$|^[^A-Za-z0-9\\u00c0-\\u024f]*$`);
const isPlaceholder = name => PLACEHOLDER.test(String(name || ''));
// Kategorie: Sprachkürzel weg ("TR Haber" -> "Haber"), GROSSBUCHSTABEN lesbar machen
const KEEP_UPPER = new Set(['HEVC', 'H265', 'H264', 'UEFA', 'NFL', 'NBA', 'WWE', 'UFC', 'MOTO', 'XXL']);
function prettyCat(name) {
  const raw = String(name || '');
  let t = raw.replace(LANG_PREFIX, '').replace(/^(?:DE|GER|TR|TUR|AT)\s+(?=\S)/, '').replace(/^[\s|:★•\-]+|[\s|:★•\-]+$/g, '').trim() || raw;
  if (t === t.toUpperCase()) {
    t = t.replace(/[^\s\/|&+\-]+/g, w => w.length <= 3 || /\d/.test(w) || KEEP_UPPER.has(w) ? w : w.charAt(0) + w.slice(1).replace(/İ/g, 'i').toLowerCase());
  }
  return t.replace(/\bTurkiye\b/g, 'Türkiye').replace(/\bTurk\b/g, 'Türk');
}

function norm(k, x) {
  const raw = x.name || '';
  if (k === 'live') return { kind: 'live', id: x.stream_id, name: chanName(raw), raw, img: x.stream_icon, cat: x.category_id, num: +x.num || 0 };
  const p = pretty(raw);
  if (k === 'movie') return { kind: 'movie', id: x.stream_id, name: p.title, raw, img: x.stream_icon, cat: x.category_id,
    ext: x.container_extension || 'mp4', rating: x.rating, added: +x.added || 0, year: year(x.year || x.releasedate) || p.year };
  return { kind: 'series', id: x.series_id, name: p.title, raw, img: x.cover, cat: x.category_id, plot: x.plot, genre: x.genre,
    rating: x.rating, year: year(x.releaseDate || x.release_date) || p.year, backdrop: first(x.backdrop_path), added: +x.last_modified || 0 };
}
const getCats = k => once('c' + k, () => api(CAT[k][0]).then(arr));
const getItems = k => once('i' + k, () => api(CAT[k][1]).then(a => arr(a).filter(x => !isPlaceholder(x.name)).map(x => norm(k, x))));
const getVodInfo = id => once('v' + id, () => api('get_vod_info', '&vod_id=' + enc(id)));

const clearCache = () => { for (const k in memo) delete memo[k]; };

/* ---------- Sprachfilter: nur deutsche und türkische Inhalte ---------- */
let langOnly = store.get('langOnly', true);
const langMiss = new Set();
const KIND_LABEL = { live: 'Live TV', movie: 'Filmen', series: 'Serien' };
const LANG_WORD = /^(deutsch|german|allemand|allemagne|alman|osterreich|oesterreich|austria|turk|tuerk|turquie)/;
const LANG_CODE_ANY = new Set(['ger', 'tr', 'tur']);
const LANG_CODE_FIRST = new Set(['de', 'at']);     // "de" ist in FR/ES ein normales Wort, daher nur als Kürzel am Anfang

// Kategorie, z. B. "DE | Kino", "|TR| Ulusal", "GERMANY HD", "Türkiye", "VOD [DE] Action", "Sky - DE"
function catLangOk(name) {
  name = String(name || '');
  const t = fold(name).split(/[^a-z0-9]+/).filter(Boolean);
  return t.some(w => LANG_WORD.test(w) || LANG_CODE_ANY.has(w)) || LANG_CODE_FIRST.has(t[0]) ||
    /[\[(|]\s*(DE|AT)\s*[-\])|]/.test(name) || /[-|:]\s*(DE|AT)\s*$/.test(name);
}
// Einzelner Titel mit Kürzel vorn, z. B. "(DE-) Film", "TR: Show TV", "|DE| RTL"
const itemLangOk = name => /^\s*[\[(|]*\s*(DE|GER|TR|TUR|AT)\s*[-\])|:★•]/.test(String(name || ''));

/* ---------- Sender nach allgemeiner Beliebtheit ----------
   Feste Reihenfolge bekannter Sender (große Vollprogramme zuerst, dann Sport, Nachrichten, Sparten).
   Ein * am Ende passt auf alle Sender, die so beginnen. Unbekannte Sender folgen in der Reihenfolge des Anbieters. */
const POPULAR = [
  // Türkei
  'trt1', 'atv', 'show', 'kanald', 'star', 'now', 'fox', 'tv8', 'kanal7', 'tv85', 'teve2', 'beyaz', 'a2', '360', 'tv100',
  'beinsports1', 'beinsports2', 'beinsports3', 'beinsports4', 'beinsports5', 'beinsportsmax1', 'beinsportsmax2', 'beinsportsmax*', 'beinsportshaber', 'beinsports*',
  'trtspor', 'trtsporyildiz', 'aspor', 'ssport', 'ssport2', 'ssportplus', 'ssport*', 'tivibuspor1', 'tivibuspor2', 'tivibuspor3', 'tivibuspor4', 'tivibuspor*',
  'sports', 'tabiispor*', 'exxen*', 'galatasaray', 'fenerbahce', 'fb', 'bjk', 'eurosport1', 'eurosport2', 'smartspor*',
  'trthaber', 'cnnturk', 'ntv', 'haberturk', 'ahaber', 'halk', 'sozcu', 'tele1', 'tgrthaber', 'haberglobal', 'ulke', 'krt', 'tvnet', 'bloomberght', 'apara',
  'trt2', 'trtbelgesel', 'trtcocuk', 'trtmuzik', 'trtturk', 'trtavaz', 'trtworld', 'trt*', 'tlc', 'dmax', 'nationalgeographic*', 'natgeo*', 'discovery*',
  'cartoonnetwork', 'minikacocuk', 'minikago', 'minika*', 'disney*', 'nickelodeon', 'nick*', 'eurod', 'eurostar', 'atvavrupa', 'showturk', 'kanal7avrupa', 'tv8int',
  'kralpop', 'powerturk', 'numberone*', 'dreamturk',
  // Deutschland
  'daserste', 'zdf', 'rtl', 'sat1', 'prosieben', 'vox', 'kabeleins', 'rtlzwei', 'arte', '3sat', 'zdfneo', 'zdfinfo', 'superrtl', 'nitro', 'rtlnitro', 'sixx',
  'prosiebenmaxx', 'sat1gold', 'kabeleinsdoku', 'tele5', 'welt', 'phoenix', 'tagesschau24', 'n24doku', 'kika', 'toggo',
  'sport1', 'skysportbundesliga1', 'skysportbundesliga*', 'skysport1', 'skysport2', 'skysporttopevent', 'skysportnews', 'skysport*', 'dazn1', 'dazn2', 'dazn*',
  'skycinema*', 'skyone', 'skyatlantic', 'sky*', 'wdr*', 'ndr*', 'brfernsehen', 'br', 'swr*', 'mdr*', 'hr*', 'rbb*', 'one', 'ardalpha',
];
const POP_EXACT = {}, POP_PREFIX = [];
POPULAR.forEach((e, i) => { if (e.slice(-1) === '*') POP_PREFIX.push([e.slice(0, -1), i]); else if (!(e in POP_EXACT)) POP_EXACT[e] = i; });
function popRank(it) {
  if (it.rank !== undefined) return it.rank;
  const base = logoBase(it.name);
  let k = (LOGO_ALIAS[base] || base).replace(/-/g, '');
  if (/tv$/.test(k) && k.length >= 5) k = k.slice(0, -2);            // "showtv" -> "show", aber "atv" und "ntv" bleiben
  let r = k in POP_EXACT ? POP_EXACT[k] : Infinity;
  if (r === Infinity) for (const p of POP_PREFIX) if (k.indexOf(p[0]) === 0) { r = p[1]; break; }
  return (it.rank = r);
}
const byPopularity = items => items.map((it, i) => [it, i]).sort((a, b) => popRank(a[0]) - popRank(b[0]) || a[1] - b[1]).map(x => x[0]);

const isTurkish = name => fold(name).split(/[^a-z0-9]+/).some(w => w === 'tr' || w === 'tur' || /^(turk|tuerk|turquie)/.test(w));

async function grouped(k) {
  const [cats, all] = await Promise.all([getCats(k).catch(() => []), getItems(k)]);
  if (k === 'live' && all.length && !all[0].lang) {
    // Sprache je Sender, für die Suche nach dem passenden offiziellen Logo
    const trCats = new Set(cats.filter(c => isTurkish(c.category_name)).map(c => String(c.category_id)));
    for (const it of all) it.lang = trCats.has(String(it.cat)) || /^\s*[\[(|]*\s*(TR|TUR)\b/.test(it.raw) ? 'tr' : 'de';
  }
  let items = all;
  if (langOnly) {
    const ok = new Set(cats.filter(c => catLangOk(c.category_name)).map(c => String(c.category_id)));
    const f = all.filter(it => ok.has(String(it.cat)) || itemLangOk(it.raw));
    if (f.length) items = f;
    else if (all.length && !langMiss.has(k)) {
      langMiss.add(k);
      toast(`Bei ${KIND_LABEL[k]} wurden keine deutschen oder türkischen Kategorien erkannt. Dort wird alles angezeigt.`, true);
    }
  }
  const by = new Map();
  for (const it of items) {
    const c = String(it.cat);
    if (!by.has(c)) by.set(c, []);
    by.get(c).push(it);
  }
  const groups = cats.filter(c => by.has(String(c.category_id)))
                     .map(c => ({ title: prettyCat(c.category_name), tr: isTurkish(c.category_name), items: by.get(String(c.category_id)) }));
  // gleicher Name in beiden Sprachen (z. B. "Netflix"): türkische Kategorie kennzeichnen
  const count = {};
  groups.forEach(g => { count[g.title] = (count[g.title] || 0) + 1; });
  groups.forEach(g => { if (count[g.title] > 1 && g.tr) g.title += ' · Türkisch'; });
  if (k === 'live') groups.forEach(g => { g.items = byPopularity(g.items); });
  const known = new Set(cats.map(c => String(c.category_id)));
  const rest = items.filter(it => !known.has(String(it.cat)));
  if (rest.length) groups.push({ title: 'Weitere', items: rest });
  return { items, groups, all };
}
const newest = items => [...items].sort((a, b) => b.added - a.added);
function pickHero(items) {
  const pool = newest(items.filter(i => i.img)).slice(0, 30);
  return pool[Math.floor(Math.random() * pool.length)];
}

/* ---------- Meine Liste und Weiterschauen ---------- */
const favs = () => store.get('favs', []);
const isFav = it => favs().some(f => f.kind === it.kind && String(f.id) === String(it.id));
function toggleFav(it) {
  const had = isFav(it);
  const keep = ({ kind, id, name, img, ext, backdrop, plot, year, rating, genre, cat }) => ({ kind, id, name, img, ext, backdrop, plot, year, rating, genre, cat });
  store.set('favs', had ? favs().filter(f => !(f.kind === it.kind && String(f.id) === String(it.id))) : [keep(it), ...favs()]);
  if (!had) bumpCat(it.kind, it.cat, 2);
  toast(had ? 'Aus „Meine Liste“ entfernt' : 'Zu „Meine Liste“ hinzugefügt');
  return !had;
}
const resumes = () => store.get('resume', {});

/* ---------- Sehgewohnheiten und Empfehlungen (bleiben in diesem Browser) ---------- */
let prefs = store.get('prefs', null) || {};
['chan', 'cat', 'seen', 'last'].forEach(k => { if (!prefs[k]) prefs[k] = {}; });
const savePrefs = () => store.set('prefs', prefs);
let liveSession = null;

// Sender zählt erst nach 20 Sekunden, Durchzappen verfälscht sonst die Liste
function endLive() {
  const s = liveSession;
  liveSession = null;
  if (!s) return;
  const sec = (Date.now() - s.start) / 1000;
  if (sec < 20) return;
  const c = prefs.chan[s.it.id] || (prefs.chan[s.it.id] = { n: 0, t: 0 });
  c.n++; c.t += Math.min(sec, 4 * 3600); c.last = Date.now();
  savePrefs();
}
// Sehzeit zählt, ältere Gewohnheiten verblassen (Halbwertszeit 3 Wochen)
const chanScore = c => (c.t + c.n * 120) * Math.pow(0.5, (Date.now() - c.last) / (21 * 864e5));
function topChannels(all, max) {
  const by = new Map(all.map(it => [String(it.id), it]));
  return Object.keys(prefs.chan).filter(id => by.has(id))
    .sort((a, b) => chanScore(prefs.chan[b]) - chanScore(prefs.chan[a])).slice(0, max).map(id => by.get(id));
}

const vodKind = e => e.kind === 'movie' ? 'movie' : 'series';
const seenKey = (kind, id) => (kind === 'movie' ? 'm' : 's') + id;
function bumpCat(kind, cat, pts) {
  if (cat == null || cat === '') return;
  const k = kind + ':' + cat;
  prefs.cat[k] = (prefs.cat[k] || 0) + pts;
  savePrefs();
}
function markSeen(e) {
  const kind = vodKind(e), id = kind === 'movie' ? e.id : e.seriesId;
  prefs.seen[seenKey(kind, id)] = Date.now();
  const keys = Object.keys(prefs.seen);
  if (keys.length > 500) keys.sort((a, b) => prefs.seen[a] - prefs.seen[b]).slice(0, keys.length - 500).forEach(k => delete prefs.seen[k]);
  if (e.cat != null) prefs.last[kind] = { name: e.name, cat: e.cat, id, ts: Date.now() };
  savePrefs();
}
const notSeen = kind => {
  const inProgress = new Set(Object.values(resumes()).map(e => seenKey(vodKind(e), e.kind === 'movie' ? e.id : e.seriesId)));
  return it => !prefs.seen[seenKey(kind, it.id)] && !inProgress.has(seenKey(kind, it.id));
};
// Gut bewertete zuerst, dann die neuesten
const byAppeal = items => [...items].sort((a, b) =>
  ((parseFloat(b.rating) || 0) >= 7 ? 1 : 0) - ((parseFloat(a.rating) || 0) >= 7 ? 1 : 0) || b.added - a.added);

// Vorschläge aus den Kategorien (Genres), die am meisten geschaut werden; mehr Punkte = öfter in der Reihe
function recommend(kind, items, max) {
  const pre = kind + ':';
  const cats = Object.keys(prefs.cat).filter(k => k.startsWith(pre))
    .map(k => ({ cat: k.slice(pre.length), s: prefs.cat[k] })).sort((a, b) => b.s - a.s).slice(0, 4);
  if (!cats.length) return [];
  const fresh = notSeen(kind);
  const pools = cats.map(c => byAppeal(items.filter(it => String(it.cat) === c.cat && fresh(it))));
  const total = cats.reduce((a, c) => a + c.s, 0), credit = cats.map(() => 0), out = [];
  while (out.length < max) {
    let best = -1;
    for (let i = 0; i < cats.length; i++) {
      if (!pools[i].length) continue;
      credit[i] += cats[i].s / total;
      if (best < 0 || credit[i] > credit[best]) best = i;
    }
    if (best < 0) break;
    credit[best] -= 1;
    out.push(pools[best].shift());
  }
  return out;
}
function becauseRow(kind, items) {
  const l = prefs.last[kind];
  if (!l) return null;
  const fresh = notSeen(kind);
  const list = byAppeal(items.filter(it => String(it.cat) === String(l.cat) && String(it.id) !== String(l.id) && fresh(it))).slice(0, 40);
  return list.length >= 4 ? { title: `Weil du „${pretty(l.name).title}“ gesehen hast`, items: list } : null;
}
function mix(a, b) {
  const out = [];
  for (let i = 0; i < Math.max(a.length, b.length); i++) { if (a[i]) out.push(a[i]); if (b[i]) out.push(b[i]); }
  return out;
}
const resumeOf = key => resumes()[key];

/* ---------- Ansichten ---------- */
const overlays = [];                // Schließfunktionen für Details und Player (Zurück-Taste)
const viewArgs = new Map();
let argId = 0, viewToken = 0, current = 'home', currentArg = null;

function go(name, arg, mode = 'push') {
  if (mode !== 'none') {
    const id = ++argId;
    viewArgs.set(id, arg);
    const st = { name, id };
    if (mode === 'push') history.pushState(st, ''); else history.replaceState(st, '');
  }
  render(name, arg);
}

window.addEventListener('popstate', e => {
  if (overlays.length) { overlays.pop()(); return; }
  const s = e.state;
  if (s && s.name && cfg) render(s.name, viewArgs.get(s.id) || null);
});

function pushOverlay(close) {
  overlays.push(close);
  history.pushState({ overlay: true, name: current, id: argId }, '');
}

async function render(name, arg) {
  const token = ++viewToken;
  current = name; currentArg = arg;
  if (name !== 'search') { $('#q').value = ''; $('.searchbox').classList.remove('open'); }
  document.querySelectorAll('.links button').forEach(b => b.classList.toggle('on', b.dataset.view === name));
  showApp();
  const main = $('#main');
  main.className = 'plain';
  setKids(main, el('div', 'spinner'));
  if (name !== 'search') window.scrollTo(0, 0);
  try {
    const v = await VIEWS[name](arg);
    if (token !== viewToken) return;
    main.className = v.hero ? '' : 'plain';
    setKids(main);
    if (v.hero) main.append(v.hero);
    const rows = el('div'); rows.id = 'rows';
    main.append(rows);
    if (v.title) rows.append(el('h1', 'page-title', v.title));
    for (const t of v.top || []) if (t) rows.append(t);
    for (const s of v.sections || []) {
      if (!s.items.length) continue;
      if (s.title) rows.append(el('h2', 'section-title', s.title));
      lazyGrid(rows, s.items);
    }
    const defs = (v.rows || []).filter(d => d && d.items && d.items.length);
    lazyRows(rows, defs);
    if (!defs.length && !(v.sections || []).some(s => s.items.length)) rows.append(el('p', 'empty', v.empty || 'Hier gibt es noch nichts.'));
  } catch (e) {
    if (token !== viewToken) return;
    main.className = 'plain';
    const p = el('p', 'empty', 'Fehler beim Laden: ' + e.message);
    p.style.paddingTop = '110px';
    setKids(main, p);
  }
}

/* ---------- Lieblingsverein: nächste Spiele und passende Sender ----------
   Spielplan von TheSportsDB (frei nutzbar), 6 Stunden zwischengespeichert. */
const SPORTS_API = 'https://www.thesportsdb.com/api/v1/json/123/';
const UEFA = ['4480', '4481', '5071'];            // Champions League, Europa League, Conference League
const MATCH_LEN = 2.25 * 3600e3;
const LEAGUE_NAMES = { 'Turkish Super Lig': 'Süper Lig', 'Turkish Cup': 'Türkiye Kupası', 'German Bundesliga': 'Bundesliga' };
let team = store.get('team', 'Galatasaray');
const wait = ms => new Promise(r => setTimeout(r, ms));
const sdb = path => fetch(SPORTS_API + path).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
const stillOn = list => list.filter(m => m.ts + MATCH_LEN + 30 * 60e3 > Date.now());

async function loadFixtures() {
  if (!team) return [];
  const cached = store.get('fixtures', null);
  const mine = cached && cached.team === team;
  if (mine && Date.now() - cached.ts < 6 * 3600e3) return stillOn(cached.list);
  let info = store.get('teamInfo', null), failed = false;
  const found = {};
  try {
    if (!info || info.q !== team) {
      const t = ((await sdb('searchteams.php?t=' + enc(team))).teams || []).filter(x => x.strSport === 'Soccer')[0];
      if (!t) { store.set('fixtures', { team, ts: Date.now(), list: [] }); return []; }
      info = { q: team, id: t.idTeam, name: t.strTeam, league: t.idLeague };
      store.set('teamInfo', info);
    }
    const take = list => (list || []).forEach(e => { if (e.idHomeTeam === info.id || e.idAwayTeam === info.id) found[e.idEvent] = e; });
    // Heimspiele aller Wettbewerbe
    try { take((await sdb('eventsnext.php?id=' + info.id)).events); } catch (e) { failed = true; }
    // Liga (aktueller und nächster Spieltag) und Europapokal (aktueller Spieltag), dort stehen auch Auswärtsspiele
    const leagues = [info.league].concat(UEFA.filter(l => l !== info.league));
    for (let i = 0; i < leagues.length; i++) {
      try {
        await wait(300);
        const nx = ((await sdb('eventsnextleague.php?id=' + leagues[i])).events || [])[0];
        if (!nx) continue;
        const rounds = i === 0 ? [+nx.intRound, +nx.intRound + 1] : [+nx.intRound];
        for (const r of rounds) {
          await wait(300);
          take((await sdb(`eventsround.php?id=${leagues[i]}&r=${r}&s=${enc(nx.strSeason)}`)).events);
        }
      } catch (e) { failed = true; }
    }
  } catch (e) { failed = true; }
  const list = Object.keys(found).map(id => {
    const e = found[id];
    return { id, home: e.strHomeTeam, away: e.strAwayTeam, hb: e.strHomeTeamBadge, ab: e.strAwayTeamBadge, league: e.strLeague, lid: String(e.idLeague),
             venue: e.strVenue, isHome: e.idHomeTeam === info.id, ts: Date.parse((e.strTimestamp || `${e.dateEvent}T${e.strTime || '00:00:00'}`) + 'Z') };
  }).filter(m => isFinite(m.ts)).sort((a, b) => a.ts - b.ts);
  if (!list.length && failed) return mine ? stillOn(cached.list) : [];
  // nach einem Teilfehler schon in 20 Minuten erneut versuchen
  store.set('fixtures', { team, ts: failed ? Date.now() - 6 * 3600e3 + 20 * 60e3 : Date.now(), list });
  return stillOn(list);
}

const dayKey = t => new Date(t).toDateString();
function whenLabel(m) {
  const now = Date.now(), min = Math.round((m.ts - now) / 60e3);
  if (now >= m.ts) return now <= m.ts + MATCH_LEN ? 'Läuft jetzt' : 'Beendet';
  if (min <= 90) return `Beginnt in ${min} Min.`;
  if (dayKey(m.ts) === dayKey(now)) return 'Heute';
  if (dayKey(m.ts) === dayKey(now + 864e5)) return 'Morgen';
  return `in ${Math.round((new Date(m.ts).setHours(0, 0, 0, 0) - new Date(now).setHours(0, 0, 0, 0)) / 864e5)} Tagen`;
}
const fmtDay = t => new Date(t).toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtClock = t => new Date(t).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
const leagueName = n => LEAGUE_NAMES[n] || n || '';

// Sender für ein Spiel: 1. laut Programm (EPG), 2. Sender mit dem Vereinsnamen, 3. übliche Sender des Wettbewerbs
const epgScans = {};
async function matchChannels(m, live) {
  const key = fold(team), f = it => fold(it.raw || it.name);
  const named = live.filter(it => f(it).includes(key) || (key === 'galatasaray' && /\bgs ?tv\b/.test(f(it))));
  const usual = UEFA.indexOf(m.lid) >= 0 ? /trt ?1\b|trt ?spor|tabii|dazn|sky sport|prime video/ : /bein ?sports?|bein ?max|a ?spor\b/;
  const likely = live.filter(it => usual.test(f(it)));
  let hits = [];
  if (m.ts - Date.now() < 36 * 3600e3) {
    if (!epgScans[m.id] || Date.now() - epgScans[m.id].ts > 20 * 60e3) {
      const sport = /bein|spor|sport|tivibu|trt ?1\b|\batv\b|tabii|exxen|dazn|tv ?8|sky/;
      const cands = likely.concat(live.filter(it => sport.test(f(it)) && likely.indexOf(it) < 0)).slice(0, 36);
      const out = [];
      let next = 0;
      const worker = async () => {
        while (next < cands.length) {
          const it = cands[next++];
          try {
            const d = await api('get_short_epg', `&stream_id=${enc(it.id)}&limit=12`);
            const hit = arr(d.epg_listings).filter(x => fold(b64(x.title) + ' ' + b64(x.description)).includes(key) &&
              x.stop_timestamp * 1000 > Date.now() && Math.abs(x.start_timestamp * 1000 - m.ts) < 6 * 3600e3)[0];
            if (hit) out.push({ it, start: hit.start_timestamp * 1000 });
          } catch (e) {}
        }
      };
      await Promise.all([worker(), worker(), worker()]);
      epgScans[m.id] = { ts: Date.now(), out };
    }
    hits = epgScans[m.id].out;
  }
  const seen = new Set(), list = [];
  const push = (it, note) => { if (!seen.has(it.id) && list.length < 18) { seen.add(it.id); list.push({ it, note }); } };
  hits.forEach(h => push(h.it, 'Im Programm ' + fmtClock(h.start)));
  named.forEach(it => push(it, ''));
  likely.forEach(it => push(it, ''));
  return { list, fromEpg: hits.length > 0 };
}

// Kasten auf der Startseite und bei Live TV; füllt sich, sobald der Spielplan da ist
function matchBox(live) {
  const box = el('div');
  if (!team) return box;
  loadFixtures().then(list => {
    const m = list[0];
    if (!m) return;
    const sec = el('section', 'match'), head = el('div', 'mhead'), txt = el('div', 'mtxt');
    const badge = src => { const i = new Image(); i.className = 'mbadge'; i.alt = ''; i.referrerPolicy = 'no-referrer'; i.onerror = () => i.remove(); i.src = src; return i; };
    const pill = el('span', 'mpill' + (Date.now() >= m.ts ? ' live' : ''), whenLabel(m));
    const title = el('h2', null, `${m.home} – ${m.away}`);
    txt.append(el('div', 'mleague', leagueName(m.league)), title,
      el('div', 'mmeta', `${fmtDay(m.ts)} · ${fmtClock(m.ts)} Uhr${m.venue ? ' · ' + m.venue : ''}`));
    if (m.hb) head.append(badge(m.hb));
    head.append(txt);
    if (m.ab) head.append(badge(m.ab));
    head.append(pill);
    sec.append(head);
    const later = list.slice(1, 3).map(x => `${fmtDay(x.ts)} ${fmtClock(x.ts)} ${x.isHome ? 'gegen ' + x.away : 'bei ' + x.home} (${leagueName(x.league)})`);
    if (later.length) sec.append(el('div', 'mlater', 'Danach: ' + later.join('  ·  ')));
    const chTitle = el('h3', null, 'Suche passende Sender ...'), slider = el('div', 'slider');
    sec.append(chTitle, slider);
    box.append(sec);
    matchChannels(m, live).then(res => {
      if (!sec.isConnected) return;
      if (!res.list.length) { chTitle.textContent = 'Kein passender Sender gefunden. Nutze die Suche oben.'; slider.remove(); return; }
      chTitle.textContent = res.fromEpg ? 'Hier läuft das Spiel' : 'Passende Sender';
      const items = res.list.map(x => x.it);
      res.list.forEach(x => slider.append(card(x.it, { note: x.note }, items)));
    });
  });
  return box;
}

// Überschrift auf der Startseite: "Filme · Kino Action", ohne Dopplung wie "Serien · Serien"
const rowTitle = (label, title) => fold(title).includes(fold(label).slice(0, 4)) ? title : `${label} · ${title}`;

const VIEWS = {
  async home() {
    const res = await settle(['movie', 'series', 'live'].map(grouped));
    if (res.every(r => r.status === 'rejected')) throw res[0].reason;
    const [M, S, L] = res.map(r => r.status === 'fulfilled' ? r.value : { items: [], groups: [], all: [] });
    const recM = recommend('movie', M.items, 30), recS = recommend('series', S.items, 30);
    const lastM = prefs.last.movie, lastS = prefs.last.series;
    const because = lastS && (!lastM || lastS.ts > lastM.ts)
      ? becauseRow('series', S.items) || becauseRow('movie', M.items)
      : becauseRow('movie', M.items) || becauseRow('series', S.items);
    const rows = [resumeRow(),
      { title: 'Deine Sender', items: topChannels(L.all, 14) },
      { title: 'Empfohlen für dich', items: mix(recM, recS).slice(0, 40) },
      favRow(), because,
      { title: 'Neu bei Filmen', items: newest(M.items).slice(0, 60) },
      { title: 'Neue Serien', items: newest(S.items).slice(0, 60) }];
    if (L.groups[0]) rows.push({ title: rowTitle('Live TV', L.groups[0].title), items: L.groups[0].items });
    for (let i = 0; i < 6; i++) {
      if (M.groups[i]) rows.push({ title: rowTitle('Filme', M.groups[i].title), items: M.groups[i].items });
      if (S.groups[i]) rows.push({ title: rowTitle('Serien', S.groups[i].title), items: S.groups[i].items });
      if (L.groups[i + 1] && i < 3) rows.push({ title: rowTitle('Live TV', L.groups[i + 1].title), items: L.groups[i + 1].items });
    }
    return { hero: hero(pickHero(recM) || pickHero(M.items) || pickHero(S.items)), top: [matchBox(L.items)], rows };
  },
  async live() {
    const L = await grouped('live');
    return { title: 'Live TV', top: [matchBox(L.items)], rows: [{ title: 'Deine Sender', items: topChannels(L.all, 14) }, ...L.groups] };
  },
  async movie() {
    const M = await grouped('movie'), rec = recommend('movie', M.items, 40);
    return { hero: hero(pickHero(rec) || pickHero(M.items)), rows: [{ title: 'Empfohlen für dich', items: rec }, becauseRow('movie', M.items),
             { title: 'Neu hinzugefügt', items: newest(M.items).slice(0, 60) }, ...M.groups] };
  },
  async series() {
    const S = await grouped('series'), rec = recommend('series', S.items, 40);
    return { hero: hero(pickHero(rec) || pickHero(S.items)), rows: [{ title: 'Empfohlen für dich', items: rec }, becauseRow('series', S.items),
             { title: 'Neu hinzugefügt', items: newest(S.items).slice(0, 60) }, ...S.groups] };
  },
  async mylist() {
    const r = resumeRow();
    return { title: 'Meine Liste', rows: r ? [r] : [], sections: [{ items: (favRow() || { items: [] }).items }],
             empty: 'Noch nichts gespeichert. In den Details eines Films oder einer Serie auf „+“ tippen.' };
  },
  async grid(a) {
    return { title: (a && a.title) || '', sections: [{ items: (a && a.items) || [] }] };
  },
  async search(q) {
    const [m, s, l] = (await settle(['movie', 'series', 'live'].map(k => grouped(k).then(g => g.items))))
      .map(r => r.status === 'fulfilled' ? r.value : []);
    const n = fold(q);
    const hit = items => items.filter(it => fold(it.name).includes(n) || fold(it.raw).includes(n)).slice(0, 60);
    return { title: `Ergebnisse für „${q}“`, empty: 'Keine Treffer.',
             sections: [{ title: 'Filme', items: hit(m) }, { title: 'Serien', items: hit(s) }, { title: 'Live TV', items: hit(l) }] };
  },
};

function resumeRow() {
  const list = Object.values(resumes()).sort((a, b) => b.ts - a.ts).slice(0, 30);

}
function favRow() {
  const f = favs().map(x => Object.assign({}, x, { name: pretty(x.name).title }));
  return f.length ? { title: 'Meine Liste', items: f } : null;
}
function refreshResumeRow() {
  if (current !== 'home' && current !== 'mylist') return;

/* ---------- Bausteine ---------- */
/* ---------- Senderlogos ----------
   1. offizielles Logo aus der freien Sammlung tv-logo/tv-logos (per Sendername),
   2. Logo des Anbieters, 3. Sendername als Text. Das Ergebnis wird gemerkt. */
const LOGO_CDN = 'https://cdn.jsdelivr.net/gh/tv-logo/tv-logos@main/countries/';
const LOGO_DROP = new Set(['hd', 'fhd', 'uhd', '4k', '8k', 'sd', 'hevc', 'h265', 'h264', 'raw', 'backup', 'yedek', '1080p', '720p',
  '1080', '720', '50fps', 'vip', 'de', 'tr', 'at', 'ger', 'tur', 'hq', 'low']);
const LOGO_ALIAS = { 'prosieben': 'pro-sieben', 'pro7': 'pro-sieben', 'prosieben-maxx': 'pro-sieben-maxx', 'pro7-maxx': 'pro-sieben-maxx',
  'zdfneo': 'zdf-neo', 'zdfinfo': 'zdf-info', 'n-tv': 'ntv', 'haber-turk': 'haberturk', 'gs-tv': 'galatasaray-tv', 'gstv': 'galatasaray-tv',
  'rtl-2': 'rtl-zwei', 'rtl2': 'rtl-zwei', 'sat1': 'sat-1', 'kabel1': 'kabel-eins', 'kabel-1': 'kabel-eins', 'ard': 'das-erste', 'show-tv': 'show' };
const logoMemo = store.get('logoMemo', {});
let logoSaveTimer = 0;
function rememberLogo(key, url) {
  logoMemo[key] = url;
  clearTimeout(logoSaveTimer);
  logoSaveTimer = setTimeout(() => {
    const keys = Object.keys(logoMemo);
    if (keys.length > 1500) keys.slice(0, keys.length - 1500).forEach(k => delete logoMemo[k]);
    store.set('logoMemo', logoMemo);
  }, 1500);
}
function logoBase(name) {
  return fold(name).replace(/ı/g, 'i').replace(/ß/g, 'ss').replace(/\+/g, ' plus ').replace(/&/g, ' and ').replace(/(\D)\.(\d)/g, '$1 $2')
    .split(/[^a-z0-9]+/).filter(w => w && !LOGO_DROP.has(w)).join('-');
}
function logoCandidates(base, lang) {
  if (!base) return [];
  const slugs = [];
  const add = x => { if (x && slugs.indexOf(x) < 0) slugs.push(x); };
  add(LOGO_ALIAS[base]); add(base);
  if (/-tv$/.test(base)) add(base.slice(0, -3)); else add(base + '-tv');
  add(base.replace(/([a-z])(\d)/g, '$1-$2'));
  if (/^dazn-\d+$/.test(base)) add('dazn');
  const order = lang === 'tr' ? [['turkey', 'tr'], ['germany', 'de']] : [['germany', 'de'], ['turkey', 'tr']];
  const urls = slugs.slice(0, 4).map(x => `${LOGO_CDN}${order[0][0]}/${x}-${order[0][1]}.png`);
  urls.push(`${LOGO_CDN}${order[1][0]}/${slugs[0]}-${order[1][1]}.png`);
  return urls;
}
function channelLogo(it, onNone) {
  const base = logoBase(it.name), key = (it.lang || 'de') + ':' + base, memo = logoMemo[key];
  const official = memo === undefined ? logoCandidates(base, it.lang) : memo ? [memo] : [];
  const list = official.concat(it.img ? [imgSrc(it.img)] : []);
  if (!list.length) { onNone(); return null; }
  const im = new Image();
  let i = 0;
  im.loading = 'lazy'; im.decoding = 'async'; im.alt = ''; im.referrerPolicy = 'no-referrer';
  im.onload = () => { if (memo === undefined) rememberLogo(key, i < official.length ? list[i] : ''); };
  im.onerror = () => {
    i++;
    if (i < list.length) im.src = list[i];
    else { if (memo === undefined) rememberLogo(key, ''); onNone(); }
  };
  im.src = list[0];
  return im;
}

function lazyImg(src, onFail) {
  const im = new Image();
  im.loading = 'lazy'; im.decoding = 'async'; im.alt = ''; im.referrerPolicy = 'no-referrer';
  im.onerror = onFail;
  im.src = imgSrc(src);
  return im;
}

function card(it, o = {}, ctx) {
  const live = it.kind === 'live';
  const c = navify(el('div', 'card ' + (live ? 'chan' : 'poster')));
  c.setAttribute('aria-label', it.name);
  c.onclick = o.onClick || (() => openItem(it, ctx));
  if (live) {
    // Sender: Logo frei auf dem Hintergrund, Name darunter
    const logo = el('div', 'logo');
    const noLogo = () => { setKids(logo, el('div', 'ctext', it.name)); c.classList.add('nologo'); };
    const im = channelLogo(it, noLogo);
    if (im) logo.append(im);
    c.append(logo, el('div', 'cname', it.name));
    if (o.note) c.append(el('div', 'cnote', o.note));
    return c;
  }
  const fb = el('div', 'fallback', it.name);
  if (it.img) { const im = lazyImg(it.img, () => im.replaceWith(fb)); c.append(im); } else c.append(fb);
  if (o.label) c.append(el('div', 'label', o.label));
  if (o.progress > 0) {
    const b = el('div', 'bar'), i = el('i');
    i.style.width = Math.min(100, o.progress * 100) + '%';
    b.append(i); c.append(b); c.classList.add('has-bar');
  }
  return c;
}

function buildRow(d) {
  const r = el('section', 'row');
  if (d.id) r.id = d.id;
  const h = el('h2', null, d.title);
  const more = d.items.length > ROW_MAX;
  const showAll = () => go('grid', { title: d.title, items: d.items });
  if (more) h.append(button(null, 'Alle anzeigen ›', showAll));
  const s = el('div', 'slider');
  for (const it of d.items.slice(0, ROW_MAX)) s.append(card(it, d.cardOpts && d.cardOpts(it), d.items));
  if (more) {
    const m = navify(el('div', 'card more-card ' + (d.items[0].kind === 'live' ? 'chan' : 'poster'), `Alle ${d.items.length} ›`));
    m.onclick = showAll;
    s.append(m);
  }
  const wrap = el('div', 'slidewrap');
  const chev = (cls, txt, dir) => {
    const b = button('chev ' + cls, txt, () => s.scrollBy({ left: dir * s.clientWidth * 0.85, behavior: 'smooth' }));
    b.tabIndex = -1;
    b.setAttribute('aria-hidden', 'true');
    return b;
  };
  wrap.append(chev('l', '‹', -1), s, chev('r', '›', 1));
  r.append(h, wrap);
  return r;
}

function lazyRows(container, defs) {
  let i = 0;
  const sentinel = el('div');
  container.append(sentinel);
  const io = new IntersectionObserver(es => { if (es[0].isIntersecting) { add(4); check(); } }, { rootMargin: '700px' });
  const add = n => {
    for (const end = Math.min(i + n, defs.length); i < end; i++) container.insertBefore(buildRow(defs[i]), sentinel);
    if (i >= defs.length) { io.disconnect(); sentinel.remove(); }
  };
  const check = () => requestAnimationFrame(() => {
    if (i < defs.length && sentinel.isConnected && sentinel.getBoundingClientRect().top < innerHeight + 700) { add(4); check(); }
  });
  add(6);
  if (sentinel.isConnected) io.observe(sentinel);
}

function lazyGrid(container, items) {
  const g = el('div', 'grid' + (items[0] && items[0].kind === 'live' ? ' chan' : ''));
  const sentinel = el('div');
  container.append(g, sentinel);
  let i = 0;
  const io = new IntersectionObserver(es => { if (es[0].isIntersecting) { add(); check(); } }, { rootMargin: '900px' });
  const add = () => {
    for (const end = Math.min(i + 120, items.length); i < end; i++) g.append(card(items[i], undefined, items));
    if (i >= items.length) { io.disconnect(); sentinel.remove(); }
  };
  const check = () => requestAnimationFrame(() => {
    if (i < items.length && sentinel.isConnected && sentinel.getBoundingClientRect().top < innerHeight + 900) { add(); check(); }
  });
  add();
  if (sentinel.isConnected) io.observe(sentinel);
}

function setBg(node, url) {

function fillMeta(meta, d) {

  if (d.year) meta.append(el('span', null, d.year));

  if (d.seasons) meta.append(el('span', null, d.seasons + (d.seasons === 1 ? ' Staffel' : ' Staffeln')));
  if (d.genre) meta.append(el('span', 'tag', String(d.genre).split(/[,/]/).slice(0, 2).join(', ')));

function hero(it) {

/* ---------- Details ---------- */
async function showDetails(it) {
  const prev = document.activeElement;
  const wrap = el('div', 'modal-wrap'), m = el('div', 'modal');
  m.setAttribute('role', 'dialog'); m.setAttribute('aria-label', it.name);
  const top = el('div', 'top');
  setBg(top, it.backdrop || it.img);
  const hc = el('div', 'hero-content'), acts = el('div', 'actions');
  const fav = button('btn round', isFav(it) ? '✓' : '+', () => { fav.textContent = toggleFav(it) ? '✓' : '+'; });
  fav.title = 'Meine Liste'; fav.setAttribute('aria-label', 'Meine Liste');
  const play = button('btn play', '▶  Abspielen', () => playItem(it));
  acts.append(play, fav);
  hc.append(el('h1', null, it.name), acts);
  top.append(hc);
  const body = el('div', 'body'), left = el('div'), side = el('div', 'side');
  const meta = el('div', 'meta'), plot = el('p', null, it.plot || '');
  fillMeta(meta, it);
  left.append(meta, plot);
  body.append(left, side);
  const close = button('btn round close', '✕', () => history.back());
  close.setAttribute('aria-label', 'Schließen');
  const eps = el('div', 'episodes');
  m.append(close, top, body, eps);
  wrap.append(m);
  wrap.onclick = e => { if (e.target === wrap) history.back(); };
  document.body.append(wrap);
  document.body.style.overflow = 'hidden';
  pushOverlay(() => { wrap.remove(); document.body.style.overflow = ''; if (prev && prev.focus) prev.focus({ preventScroll: true }); });
  play.focus({ preventScroll: true });

  const sideInfo = pairs => setKids(side, ...pairs.filter(p => p[1]).map(([k, v]) => {
    const d = el('div'); d.append(el('b', null, k + ': '), String(v)); return d;
  }));
  try {
    if (it.kind === 'movie') {
      const d = await getVodInfo(it.id), i = d.info || {};
      if (d.movie_data && d.movie_data.container_extension) it.ext = d.movie_data.container_extension;
      setBg(top, first(i.backdrop_path));
      plot.textContent = i.plot || i.description || it.plot || '';
      fillMeta(meta, { ...it, year: year(i.releasedate) || it.year, rating: i.rating || it.rating, genre: i.genre, duration: i.duration });
      sideInfo([['Besetzung', i.cast || i.actors], ['Regie', i.director], ['Genres', i.genre]]);
    } else {
      eps.append(el('div', 'spinner small'));
      const d = await getSeriesInfo(it.id), i = d.info || {};
      setBg(top, first(i.backdrop_path));
      plot.textContent = i.plot || it.plot || '';
      const seasons = Object.keys(d.episodes || {}).sort((a, b) => a - b);
      fillMeta(meta, { ...it, year: year(i.releaseDate) || it.year, rating: i.rating || it.rating, genre: i.genre, seasons: seasons.length });
      sideInfo([['Besetzung', i.cast], ['Regie', i.director], ['Genres', i.genre]]);
      renderEpisodes(eps, it, d, seasons);
    }
  } catch (e) {
    setKids(eps);
    if (!plot.textContent) plot.textContent = 'Details konnten nicht geladen werden (' + e.message + ').';
  }
}

function renderEpisodes(box, series, d, seasons) {
  setKids(box);
  if (!seasons.length) { box.append(el('p', 'empty', 'Keine Folgen gefunden.')); return; }
  const head = el('div', 'ephead'), sel = el('select'), list = el('div');
  head.append(el('h3', null, 'Folgen'));
  sel.setAttribute('aria-label', 'Staffel');
  seasons.forEach(s => sel.append(new Option('Staffel ' + s, s)));
  if (seasons.length > 1) head.append(sel);
  const res = resumes();
  const show = s => {
    setKids(list);
    d.episodes[s].forEach((ep, idx) => {
      const row = navify(el('div', 'ep'));
      const thumb = el('div', 'thumb');
      const inf = ep.info || {};
      const src = inf.movie_image || series.img;
      if (src) { const im = new Image(); im.loading = 'lazy'; im.alt = ''; im.referrerPolicy = 'no-referrer'; im.src = imgSrc(src); im.onerror = () => im.remove(); thumb.append(im); }
      const r = res['e' + ep.id];
      if (r) { const b = el('div', 'bar'), i = el('i'); i.style.width = Math.min(100, r.t / r.d * 100) + '%'; b.append(i); thumb.append(b); }
      const t = el('div', 't'), b = el('b');
      b.append(el('span', null, chanName(ep.title) || `Folge ${ep.episode_num || idx + 1}`), el('span', null, inf.duration || ''));
      t.append(b, el('p', null, inf.plot || ''));
      row.append(el('span', 'n', String(ep.episode_num || idx + 1)), thumb, t);
      row.onclick = () => playEpisode(series, ep, s);
      list.append(row);
    });
  };
  const last = Object.values(res).filter(e => String(e.seriesId) === String(series.id)).sort((a, b) => b.ts - a.ts)[0];
  sel.value = last && seasons.includes(String(last.season)) ? String(last.season) : seasons[0];
  sel.onchange = () => show(sel.value);
  show(sel.value);
  box.append(head, list);
}

/* ---------- Wiedergabe ---------- */
let hls = null, tsPlayer = null, nowPlaying = null, lastSave = 0, idleTimer = 0;
const video = $('#video');
const nativeHls = () => !!video.canPlayType('application/vnd.apple.mpegurl');

function openItem(it, ctx) { if (it.kind === 'live') playLive(it, ctx); else showDetails(it); }

function playItem(it) {
  if (it.kind === 'movie') return playMovie(it);
  if (it.kind === 'series') return playSeriesStart(it);
  if (it.kind === 'live') return playLive(it);
}

function openPlayer(title, sub) {
  if ($('#player').hidden) {
    $('#player').hidden = false;
    document.body.style.overflow = 'hidden';
    pushOverlay(closePlayer);
  }
  $('#pTitle').textContent = title;
  $('#pSub').textContent = sub || '';
  wake();
}

function closePlayer() {
  endLive();
  saveProgress(true);
  stopPlayback();
  nowPlaying = null;
  $('#player').hidden = true;
  document.body.style.overflow = document.querySelector('.modal-wrap') ? 'hidden' : '';
  refreshResumeRow();
}

// Wiedergabe beenden, damit der Anbieter die Verbindung freigibt (meist nur 1 erlaubt)
function stopPlayback() {
  if (hls) { hls.destroy(); hls = null; }
  if (tsPlayer) { try { tsPlayer.destroy(); } catch (e) {} tsPlayer = null; }
  video.onerror = video.onended = null;
  video.pause();
  video.removeAttribute('src');
  video.load();
}

// VLC (kostenlose App) spielt auch mkv/avi. Es holt den Stream über den Proxy,
// weil der Anbieter VLC bei direkter Verbindung nicht beliefert hat.
const abs = u => new URL(u, location.href).href;
const vlcActions = direct => [
  { label: 'In VLC öffnen', href: 'vlc-x-callback://x-callback-url/stream?url=' + enc(direct) },
  { label: 'VLC installieren (kostenlos)', href: 'https://apps.apple.com/app/id650377962' },
];
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Mac/.test(navigator.platform) && navigator.maxTouchPoints > 1);

function startStream(src, live, name) {
  stopPlayback();
  const useTs = live && !nativeHls() && window.mpegts && mpegts.isSupported();
  const url = live ? (useTs ? src.ts : src.m3u8) : src.url;
  const vlc = isIOS && src.direct ? vlcActions(src.direct) : null;
  const fail = why => { toast(`Wiedergabe-Fehler: ${name} (${why})\nPrüfe Verbindung ...`, true, vlc); diagnose(url, name, why, vlc); };
  if (useTs) {
    // Live-Sender als .ts-Stream (Desktop-Browser)
    tsPlayer = mpegts.createPlayer({ type: 'mpegts', isLive: true, url }, { enableStashBuffer: false, liveBufferLatencyChasing: true });
    tsPlayer.attachMediaElement(video);
    tsPlayer.on(mpegts.Events.ERROR, (type, detail, data) => {
      const extra = data && (data.code || data.msg) ? `, ${data.code == null ? '' : data.code} ${data.msg || ''}`.trim() : '';
      fail(`${type}/${detail}${extra}`);
    });
    tsPlayer.load();
    Promise.resolve(tsPlayer.play()).catch(() => {});
  } else if (url.includes('.m3u8') && !nativeHls() && window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
    hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) fail(d.details); });
  } else {
    // iPhone/iPad/Safari: eingebauter Player (HLS, mp4)
    video.onerror = () => {
      const fmt = (url.match(/\.(\w+)(?:$|%3F|\?|&)/i) || [])[1] || '';
      const hint = /mkv|avi/i.test(fmt) ? ` – Format .${fmt} kann dieser Browser nicht abspielen` : '';
      fail(`Code ${video.error ? video.error.code : '?'}${hint}`);
    };
    video.src = url;
    video.play().catch(() => {});
  }
}

// Fragt den Proxy, was beim Anbieter wirklich passiert, und zeigt es an
async function diagnose(url, name, why, action) {
  if (!url.includes('?u=')) return toast(`Wiedergabe-Fehler: ${name} (${why})\nKein Proxy eingetragen.`, true, action);
  try {
    const r = await fetch(url + '&debug=1');
    const t = await r.text();
    toast(`Wiedergabe-Fehler: ${name} (${why})\n` + (r.ok ? t : `Proxy antwortet HTTP ${r.status}: ${t.slice(0, 300)}`), true, action);
  } catch (e) {
    toast(`Wiedergabe-Fehler: ${name} (${why})\nProxy nicht erreichbar: ${e.message}`, true, action);
  }
}

function playLive(it, list) {
  list = (list || [it]).filter(x => x.kind === 'live');
  if (!list.includes(it)) list = [it];
  endLive();
  liveSession = { it, start: Date.now() };
  nowPlaying = { live: true, it, list, idx: list.indexOf(it) };
  openPlayer(it.name, '');
  $('#pPrev').hidden = $('#pNext').hidden = list.length < 2;
  const raw = ext => `${base()}/live/${cred()}/${it.id}.${ext}`;
  startStream({ ts: px(raw('ts')), m3u8: px(raw('m3u8')), direct: abs(px(raw('ts'))) }, true, it.name);
  loadEpg(it);
}

function switchChannel(step) {
  const np = nowPlaying;
  if (!np || !np.live || np.list.length < 2) return;
  const idx = (np.idx + step + np.list.length) % np.list.length;
  playLive(np.list[idx], np.list);
}

async function loadEpg(it) {
  try {
    const d = await api('get_short_epg', `&stream_id=${enc(it.id)}&limit=2`);
    if (!nowPlaying || nowPlaying.it !== it) return;
    const l = arr(d.epg_listings).slice(0, 2);
    $('#pSub').textContent = l.map((x, i) =>
      `${i ? 'Danach' : 'Jetzt'}: ${b64(x.title)} (${fmtTime(x.start_timestamp)}–${fmtTime(x.stop_timestamp)})`).join('   ·   ');
  } catch (e) {}
}

const vodRaw = e => `${base()}/${e.kind === 'movie' ? 'movie' : 'series'}/${cred()}/${e.id}.${e.ext || 'mp4'}`;

function playVod(e, at) {
  bumpCat(vodKind(e), e.cat, 1);
  markSeen(e);
  // mkv, avi usw. kann kein iPhone- oder iPad-Browser abspielen: gleich VLC anbieten
  if (isIOS && /^(mkv|avi|wmv|flv)$/i.test(e.ext || '')) {
    return toast(`„${e.name}“ liegt im Format .${e.ext} vor. Das kann kein iPhone-Browser abspielen.\n` +
      'Mit der kostenlosen App VLC läuft der Film. Zeigt „In VLC öffnen“ einen Fehler, ist VLC noch nicht installiert.',
      true, vlcActions(abs(px(vodRaw(e)))));
  }
  nowPlaying = { live: false, e, seek: at > 5 ? at : 0 };
  openPlayer(e.name, e.sub);
  $('#pPrev').hidden = $('#pNext').hidden = true;
  startStream({ url: px(vodRaw(e)), direct: abs(px(vodRaw(e))) }, false, e.name);
  video.onended = () => {
    const r = resumes(); delete r[e.key]; store.set('resume', r);
    if (e.kind === 'ep') nextEpisode(e);
  };
}

function playMovie(it) {
  const e = { key: 'm' + it.id, kind: 'movie', id: it.id, ext: it.ext || 'mp4', name: it.name, img: it.img, cat: it.cat };
  playVod(e, (resumeOf(e.key) || {}).t);
}

function playEpisode(series, ep, season) {
  const e = { key: 'e' + ep.id, kind: 'ep', id: ep.id, ext: ep.container_extension || 'mp4', name: series.name,
              sub: `S${season} F${ep.episode_num || ''} · ${chanName(ep.title)}`.replace(/ · $/, ''), img: series.img,
              seriesId: series.id, season, cat: series.cat };
  playVod(e, (resumeOf(e.key) || {}).t);
}

async function playSeriesStart(it) {
  const last = Object.values(resumes()).filter(e => String(e.seriesId) === String(it.id)).sort((a, b) => b.ts - a.ts)[0];
  if (last) return playVod(last, last.t);
  try {
    const d = await getSeriesInfo(it.id);
    const s = Object.keys(d.episodes || {}).sort((a, b) => a - b)[0];
    if (!s) return toast('Keine Folgen gefunden.');
    playEpisode(it, d.episodes[s][0], s);
  } catch (e) { toast('Folgen konnten nicht geladen werden: ' + e.message); }
}

async function nextEpisode(e) {
  try {
    const d = await getSeriesInfo(e.seriesId);
    const all = Object.keys(d.episodes || {}).sort((a, b) => a - b).flatMap(s => d.episodes[s].map(ep => ({ ep, s })));
    const i = all.findIndex(x => String(x.ep.id) === String(e.id));
    if (i >= 0 && all[i + 1] && nowPlaying && nowPlaying.e === e) {
      toast('Nächste Folge ...');
      playEpisode({ id: e.seriesId, name: e.name, img: e.img, cat: e.cat }, all[i + 1].ep, all[i + 1].s);
    }
  } catch (e) {}
}

function saveProgress(force) {
  const np = nowPlaying;
  if (!np || np.live) return;
  const t = video.currentTime, d = video.duration;
  if (!isFinite(d) || d <= 0) return;
  const now = Date.now();
  if (!force && now - lastSave < 5000) return;
  lastSave = now;
  // wirklich geschaut (15 Minuten oder die Hälfte): Kategorie zählt stärker
  if (!np.credited && (t > 900 || t / d > 0.5)) { np.credited = true; bumpCat(vodKind(np.e), np.e.cat, 3); }
  const r = resumes();
  if (t / d > 0.95) delete r[np.e.key];
  else if (t > 10) r[np.e.key] = { ...np.e, t, d, ts: now };
  const keys = Object.keys(r).sort((a, b) => r[b].ts - r[a].ts);
  keys.slice(50).forEach(k => delete r[k]);
  store.set('resume', r);
}

video.addEventListener('timeupdate', () => saveProgress(false));
window.addEventListener('pagehide', () => { endLive(); saveProgress(true); });
video.addEventListener('pause', () => saveProgress(true));
video.addEventListener('loadedmetadata', () => {
  if (nowPlaying && nowPlaying.seek) { try { video.currentTime = nowPlaying.seek; } catch (e) {} nowPlaying.seek = 0; }
});

function wake() {
  $('#player').classList.remove('idle');

  idleTimer = setTimeout(() => { if (!video.paused) $('#player').classList.add('idle'); }, 3500);
}

/* ---------- Fernbedienung und Tastatur ---------- */
function layer() {
  if (!$('#player').hidden) return $('#player');
  const modals = document.querySelectorAll('.modal-wrap');
  if (modals.length) return modals[modals.length - 1];
  if (!$('#menu').hidden) return $('#menu');
  if (!$('#login').hidden) return $('#login');
  return document.body;
}
function move(dir) {
  const root = layer();
  const list = [...root.querySelectorAll('[data-nav], button, input, select, video')]
    .filter(e => !e.disabled && !e.classList.contains('chev') && e.getClientRects().length && !e.closest('[hidden]') && (root !== document.body || !e.closest('#player, #menu, #login, #toast')));
  const cur = document.activeElement;
  if (!list.includes(cur)) {
    const start = root.querySelector('.btn.play, [data-nav]') || list[0];
    if (start) { start.focus(); start.scrollIntoView({ block: 'center', inline: 'nearest' }); }
    return;
  }
  const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, score = Infinity;
  for (const e of list) {
    if (e === cur) continue;
    const b = e.getBoundingClientRect(), dx = b.left + b.width / 2 - ax, dy = b.top + b.height / 2 - ay;
    let main, cross;
    if (dir === 'left' || dir === 'right') {
      if (dir === 'left' ? dx > -4 : dx < 4) continue;
      if (b.bottom <= a.top || b.top >= a.bottom) continue;      // nur in derselben Zeile
      main = Math.abs(dx); cross = Math.abs(dy) * 4;
    } else {
      if (dir === 'up' ? dy > -4 : dy < 4) continue;
      main = Math.abs(dy); cross = Math.abs(dx) * 1.5;
    }
    if (main + cross < score) { score = main + cross; best = e; }
  }
  if (!best) return;
  best.focus({ preventScroll: true });
  if (best.closest('nav')) window.scrollTo({ top: 0, behavior: 'smooth' });
  else best.scrollIntoView({ block: dir === 'up' || dir === 'down' ? 'center' : 'nearest', inline: 'nearest', behavior: 'smooth' });
}

// Fernbedienungen melden Tasten teils nur als Zahlencode
const KEYCODES = { 37: 'ArrowLeft', 38: 'ArrowUp', 39: 'ArrowRight', 40: 'ArrowDown', 13: 'Enter', 27: 'Escape', 8: 'Backspace',
                   461: 'GoBack', 10009: 'GoBack', 33: 'PageUp', 34: 'PageDown', 427: 'ChannelUp', 428: 'ChannelDown' };

document.addEventListener('keydown', e => {
  const t = e.target, k = e.key && e.key !== 'Unidentified' ? e.key : (KEYCODES[e.keyCode] || '');
  const typing = t.tagName === 'INPUT';
  const back = k === 'Escape' || k === 'GoBack' || k === 'BrowserBack' || (k === 'Backspace' && !typing);

  if (!$('#player').hidden) {
    wake();
    if (back) { e.preventDefault(); history.back(); }
    else if (k === 'PageUp' || k === 'ChannelUp') { e.preventDefault(); switchChannel(-1); }
    else if (k === 'PageDown' || k === 'ChannelDown') { e.preventDefault(); switchChannel(1); }
    else if ((k === 'ArrowUp' || k === 'ArrowDown') && t === video && nowPlaying && nowPlaying.live) { e.preventDefault(); switchChannel(k === 'ArrowUp' ? -1 : 1); }
    else if (k === 'Enter' && t === video) { e.preventDefault(); video.paused ? video.play() : video.pause(); }
    return;
  }
  if (back) {
    if (!$('#menu').hidden) { $('#menu').hidden = true; $('#avatar').focus(); return; }
    if (overlays.length) { e.preventDefault(); history.back(); return; }
    if (t.id === 'q') { t.value = ''; t.blur(); if (current === 'search') history.back(); return; }
    if (k !== 'Escape' && !$('#main').hidden && current !== 'home') { e.preventDefault(); history.back(); }
    return;
  }
  const dir = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }[k];
  if (dir) {
    if (typing && (dir === 'left' || dir === 'right')) return;
    if (t.tagName === 'SELECT' && (dir === 'up' || dir === 'down')) return;
    e.preventDefault();
    move(dir);
  } else if (k === 'Enter' && t.dataset && 'nav' in t.dataset && t.tagName !== 'BUTTON') {
    e.preventDefault();
    t.click();
  }
});

/* ---------- Start ---------- */
if (cfg) {
  showApp();
  if (HP) cfg.proxy = '';
  history.replaceState({ name: 'home', id: 0 }, '');
  render('home', null);
  api('').then(d => {
    if (!d.user_info || d.user_info.auth != 1) throw new Error('Anmeldung abgelehnt');
    info = d.user_info;
  }).catch(e => { toast('Verbindung fehlgeschlagen: ' + e.message, true); showLogin(); });
} else {
  showLogin();
}
</script>
